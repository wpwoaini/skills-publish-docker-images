name: Keep HF Space Awake

on:
  schedule:
    # 每 20 分钟跑一次（UTC），HF Spaces 免费版 48 小时休眠，这个频率足够防睡
    - cron: '*/20 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          curl -fsS https://keawqe-ac.hf.space/api/ping \
            --max-time 10 \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            || curl -fsS https://keawqe-ac.hf.space \
                     --max-time 10 \
                     -o /dev/null \
                     -w "Fallback HTTP %{http_code} in %{time_total}s\n"
