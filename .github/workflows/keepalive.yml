name: Keep HF Space Awake

on:
  schedule:
    # UTC 时区 每5分钟执行一次
    - cron: '*/5 * * * *'
  # 支持手动点按钮触发调试
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space to prevent sleep
        run: |
          # 优先调用ping接口
          curl -fsS https://keawqe-ac.hf.space/api/ping \
            --max-time 10 \
            -o /dev/null \
            -w "Primary ping HTTP %{http_code}, cost %{time_total}s\n" \
          || \
          # 接口失败则访问主页兜底保活
          curl -fsS https://keawqe-ac.hf.space \
            --max-time 10 \
            -o /dev/null \
            -w "Fallback ping HTTP %{http_code}, cost %{time_total}s\n"
