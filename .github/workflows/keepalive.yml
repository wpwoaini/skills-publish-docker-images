name: Keep HF Space Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟执行一次
  workflow_dispatch:        # 允许手动触发测试

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🟢 Ping Hugging Face Space
        run: |
          echo "🔄 正在访问: https://keawqe-ac.hf.space/"
          curl -I -L -m 30 -A "GitHub-KeepAlive/1.0" https://keawqe-ac.hf.space/ || true
          echo "✅ 访问完成"
